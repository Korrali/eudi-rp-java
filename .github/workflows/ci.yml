name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: >
          mvn -B -pl eudi-rp-core,eudi-rp-spring-boot-starter,eudi-rp-mock-wallet,eudi-rp-demo -am
          verify

      - name: Verify eudi-rp-core has zero Spring imports
        run: |
          if grep -rq "org.springframework" eudi-rp-core/src; then
            echo "eudi-rp-core must have zero Spring imports (hexagonal boundary)"
            grep -rn "org.springframework" eudi-rp-core/src
            exit 1
          fi
