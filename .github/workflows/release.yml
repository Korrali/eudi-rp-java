name: release

# Triggered by pushing a tag like v0.1.0. Requires these repository secrets:
#   GPG_PRIVATE_KEY        — armored private key for signing release artifacts
#   GPG_PASSPHRASE         — passphrase for that key
#   CENTRAL_TOKEN_USERNAME — Central Portal user token username (not your account password)
#   CENTRAL_TOKEN_PASSWORD — Central Portal user token password
# The com.korrali namespace must also already be verified on Central Portal via a DNS TXT record
# on korrali.com before a deploy can succeed.
#
# The Maven Central deploy lands as a validated-but-unpublished deployment on Central Portal
# (autoPublish is false in the release profile) — publishing it live still needs a human to log
# into central.sonatype.com and confirm, on purpose.

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 with GPG and Central Portal server config
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Run tests
        run: >
          mvn -B -pl eudi-rp-core,eudi-rp-spring-boot-starter,eudi-rp-mock-wallet,eudi-rp-demo -am
          test

      - name: Publish eudi-rp-core, eudi-rp-spring-boot-starter, eudi-rp-mock-wallet to Maven Central
        run: >
          mvn -B -Prelease -pl eudi-rp-core,eudi-rp-spring-boot-starter,eudi-rp-mock-wallet -am
          deploy -DskipTests
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
